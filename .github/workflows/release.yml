name: Release

# Cuts a GitHub Release with prebuilt porta-app binaries for macOS
# (Apple Silicon + Intel), Linux (x86_64 + aarch64, the latter on a
# genuine ARM runner), and Windows - all with the full `realtime,ui`
# feature set, the same combination verified to build together in
# TASKS.md. The aarch64 Linux build doubles as a real per-commit signal
# for M6's Pi deployment, short of the actual hardware.
#
# To cut a release: bump `workspace.package.version` in Cargo.toml,
# commit, then `git tag vX.Y.Z && git push origin vX.Y.Z`. Pushing the
# tag is what triggers publishing; workflow_dispatch runs the same
# matrix without publishing, for testing the build side alone.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Never publish a build that didn't pass the project's own gate.
  gate:
    name: Full test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    name: ${{ matrix.name }}
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            features: realtime,ui
          - name: macos-x86_64
            # No native Intel runner label exists anymore; Xcode's
            # linker on Apple Silicon cross-links x86_64 fine.
            os: macos-14
            target: x86_64-apple-darwin
            features: realtime,ui
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: realtime,ui
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: realtime,ui
          - name: linux-aarch64
            # A genuine ARM machine, not cross-compiled. Built inside a
            # debian:bookworm container rather than the runner's own
            # Ubuntu 24.04 userland: real Raspberry Pi OS is Debian
            # bookworm (glibc 2.36), Ubuntu 24.04 ships glibc 2.39, and
            # a glibc binary won't run against an *older* glibc than it
            # was linked against - confirmed the hard way, 2026-08-21,
            # by actually copying an Ubuntu-built binary onto a real
            # Pi 4 and watching it fail with "GLIBC_2.39 not found".
            # This is the real per-commit signal for M6's Pi aarch64
            # build the plain-Ubuntu-runner version only looked like.
            os: ubuntu-24.04-arm
            container: debian:bookworm
            target: aarch64-unknown-linux-gnu
            features: realtime,ui
    container: ${{ matrix.container }}
    steps:
      # A bare debian:bookworm image has no git - actions/checkout
      # needs it, so this has to happen before that step, not folded
      # into the dependency-install step below.
      - name: Bootstrap container
        if: matrix.container != ''
        run: apt-get update && apt-get install -y git ca-certificates curl

      - uses: actions/checkout@v4

      - name: Install Rust (container has none preinstalled)
        if: matrix.container != ''
        run: |
          set -euo pipefail
          apt-get install -y build-essential pkg-config
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux build deps (cpal + Slint)
        if: runner.os == 'Linux'
        run: |
          if command -v sudo >/dev/null 2>&1; then SUDO=sudo; else SUDO=; fi
          $SUDO apt-get update
          $SUDO apt-get install -y \
            libasound2-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libfontconfig-dev

      - run: rustup target add ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.features }}" ]; then
            cargo build --release -p porta-app --target ${{ matrix.target }} \
              --features "${{ matrix.features }}"
          else
            cargo build --release -p porta-app --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          bin=porta-app
          if [[ "${{ runner.os }}" == "Windows" ]]; then bin=porta-app.exe; fi

          stage="openporta-${GITHUB_REF_NAME:-dev}-${{ matrix.name }}"
          mkdir "$stage"
          cp "target/${{ matrix.target }}/release/$bin" "$stage/"
          cp README.md LICENSE "$stage/"

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            asset="$stage.zip"
            7z a "$asset" "$stage" >/dev/null
          else
            asset="$stage.tar.gz"
            tar czf "$asset" "$stage"
          fi
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} dist/ \;
          ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
