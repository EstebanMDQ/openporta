name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup on the runner picks up rust-toolchain.toml automatically
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # `ui` is not a default feature, so the default gate above compiles
  # nothing behind `#[cfg(feature = "ui")]` - only release.yml builds
  # it, and only on a tag. That left ui.rs unable to fail CI at all.
  # This job closes that hole (change 003, REQ-901/906).
  ui:
    name: realtime,ui gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # The same list release.yml's Linux legs install: ci.yml installs
      # no system packages of its own, and without these the job fails
      # on its first commit.
      - name: Install Linux build deps (cpal + Slint)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libasound2-dev libpipewire-0.3-dev libclang-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libfontconfig-dev
      # clippy alone executes nothing, so the tests run too.
      - run: cargo clippy --features realtime,ui --all-targets -- -D warnings
      - run: cargo test --features realtime,ui --workspace
      # REQ-1005, bounded on purpose: unbounded, "MUST NOT hang" would
      # sit until the runner's own limit and the requirement would
      # quietly become a hope. Exit 124 is timeout's own code and must
      # fail the step rather than count as "non-zero".
      - name: Bare launch with no display reports and exits non-zero
        run: |
          cargo build --features realtime,ui -p porta-app
          set +e
          env -u DISPLAY -u WAYLAND_DISPLAY timeout 30 ./target/debug/porta-app >launch.txt 2>&1
          code=$?
          set -e
          cat launch.txt
          if [ "$code" -eq 124 ]; then
            echo "FAIL: hung until the timeout instead of reporting"; exit 1
          fi
          if [ "$code" -eq 0 ]; then
            echo "FAIL: exited successfully with no display"; exit 1
          fi
          grep -q '^usage:' launch.txt || { echo "FAIL: no usage text"; exit 1; }
          grep -q '^error: ' launch.txt || { echo "FAIL: no reason line"; exit 1; }
          echo "reported and exited $code"
