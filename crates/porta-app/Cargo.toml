[package]
name = "porta-app"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
porta-engine = { workspace = true }
porta-dsp = { workspace = true }
hound = { workspace = true }
# MP3 export alongside WAV: pure Rust (no C toolchain, unlike the LGPL
# alternative wrapping LAME via autotools), so no release.yml build-dep
# changes needed on any platform. LGPL-2.0, same as every real MP3
# encoder in the Rust ecosystem today - none are permissively licensed.
shine-rs = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# "pipewire" only affects Linux (target-gated inside cpal itself, so
# it's a no-op on macOS/Windows): cpal's ALSA host enumerates the same
# physical device many times over (hw:, plughw:, dmix, front, ...) all
# under one identical display name with no way to tell them apart -
# found 2026-08-21 selecting the Zoom L6 by name on the Pi. PipeWire's
# own host talks to it as one real device instead.
cpal = { version = "0.18", optional = true, features = ["pipewire"] }
rtrb = { version = "0.3", optional = true }
slint = { version = "1.17", optional = true }
# Free-space indicator in the Tapes view. fs2's actively-maintained
# successor - no libc dependency on Linux (uses rustix), same
# available_space() call on macOS and Linux. UI-only: nothing else
# needs disk-space info.
fs4 = { version = "0.13", optional = true }

[build-dependencies]
slint-build = "1.17"

[dev-dependencies]
porta-testkit = { workspace = true }

[features]
default = []
realtime = ["dep:cpal", "dep:rtrb"]
ui = ["dep:slint", "dep:fs4"]

[lints]
workspace = true
