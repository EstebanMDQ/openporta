[package]
name = "porta-app"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
porta-engine = { workspace = true }
porta-dsp = { workspace = true }
hound = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
cpal = { version = "0.18", optional = true }
rtrb = { version = "0.3", optional = true }
slint = { version = "1.17", optional = true }

[build-dependencies]
slint-build = "1.17"

[dev-dependencies]
porta-testkit = { workspace = true }

[features]
default = []
realtime = ["dep:cpal", "dep:rtrb"]
ui = ["dep:slint"]

[lints]
workspace = true
