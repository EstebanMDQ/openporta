<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Cassette shell -->
  <rect x="3" y="6" width="42" height="36" rx="4" fill="#2b2b2b"/>
  <!-- Recessed window housing the reels -->
  <rect x="7" y="10" width="34" height="15" rx="2" fill="#161616"/>
  <circle cx="16" cy="17.5" r="6" fill="#e8e8e8"/>
  <circle cx="16" cy="17.5" r="2.1" fill="#2b2b2b"/>
  <circle cx="32" cy="17.5" r="6" fill="#e8e8e8"/>
  <circle cx="32" cy="17.5" r="2.1" fill="#2b2b2b"/>
  <!-- Tape path between the reels -->
  <path d="M 21.6 17.5 L 26.4 17.5" stroke="#4a4a4a" stroke-width="1.4"/>
  <!-- Label -->
  <rect x="7" y="28" width="34" height="9" rx="1.5" fill="#4caf6d"/>
  <rect x="10" y="31" width="28" height="2.6" fill="#1b1b1b" opacity="0.35"/>
  <!-- Screws -->
  <circle cx="10" cy="39.5" r="1.6" fill="#111111"/>
  <circle cx="38" cy="39.5" r="1.6" fill="#111111"/>
</svg>
